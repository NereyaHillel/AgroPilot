[project]
name = "weather-service"
version = "0.1.0"
description = "AgroPilot weather service: cached daily ET0 and rain forecast."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.6",
    "uvicorn~=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "registry-service"
version = "0.1.0"
description = "AgroPilot registry service."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn~=0.32.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sqlite_only: runs only when TEST_DATABASE_URL is not set",
    "postgres_only: runs only when TEST_DATABASE_URL is set",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", "seed_registry_pg.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
